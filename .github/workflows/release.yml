name: Windows distribution

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Ensure Inno Setup 6
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --version=6.4.3 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          }
          if (-not (Test-Path $compiler)) { throw 'Inno Setup 6 compiler is missing.' }
          $compilerHelp = & $compiler '/?' | Out-String
          if ($LASTEXITCODE -notin 0, 1) { throw 'Inno Setup compiler could not display its version/help.' }
          if ($compilerHelp -notmatch 'Inno Setup 6 Command-Line Compiler') {
            throw 'The installed compiler is not Inno Setup 6.'
          }
          Split-Path $compiler | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          # ISCC reports usage with exit code 1; the version check above is the result.
          exit 0

      - name: Check release version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [xml] $project = Get-Content GlanceBar.csproj -Raw
          $version = $project.SelectSingleNode('/Project/PropertyGroup/Version').InnerText
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag must match the project Version.' }

      - name: Build installer and checksums
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/Build-Release.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed.' }

      - name: Check distribution files
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem dist -Filter '*-win-x64-Setup.exe' -File)
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows x64 installer.' }
          foreach ($installer in $installers) {
            if ($installer.Length -eq 0) { throw 'Installer is empty.' }
            $checksum = "$($installer.FullName).sha256"
            if (-not (Test-Path $checksum)) { throw "Missing checksum: $checksum" }
            $actual = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash
            $recorded = (Get-Content $checksum -Raw).Trim()
            if ($recorded -notmatch "(?i)^$actual(?:\s|$)") { throw 'Installer checksum does not match.' }
          }

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: GlanceBar-windows-x64
          path: |
            dist/*.exe
            dist/*.sha256
          if-no-files-found: error

      - name: Create tagged draft release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = @(Get-ChildItem dist -File | Where-Object { $_.Extension -in '.exe', '.sha256' } | ForEach-Object FullName)
          gh release view $env:RELEASE_TAG --json isDraft | Out-Null
          if ($LASTEXITCODE -eq 0) {
            $release = gh release view $env:RELEASE_TAG --json isDraft | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Could not inspect existing release.' }
            if (-not $release.isDraft) { throw 'Refusing to replace assets of an already published release.' }
            gh release upload $env:RELEASE_TAG @assets --clobber
          } else {
            gh release create $env:RELEASE_TAG @assets --verify-tag --draft --title "GlanceBar $env:RELEASE_TAG" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'Draft release upload failed.' }
